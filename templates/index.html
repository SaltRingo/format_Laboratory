<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>発表情報フォーマッター</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
      background: #f7f7f7;
    }
    textarea, pre {
      width: 100%;
      font-size: 1rem;
    }
    .button {
      background: #3182ce;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
    }
    .output {
      background: #fff;
      padding: 1rem;
      border: 1px solid #ccc;
      white-space: pre-wrap;
      margin-top: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    label {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>発表情報フォーマッター</h1>

  <form method="POST">
    <label>スプレッドシートからコピーした複数行のデータを貼り付けてください：</label><br>
    <textarea name="input_text" rows="10" placeholder="タブ区切りで貼り付け..." required>{{ input_text }}</textarea><br>
    <button type="submit" class="button">整形する</button>
  </form>

  {% if formatted %}
    <div class="output">
      <h2>整形結果</h2>
      <pre>{{ formatted }}</pre>
    </div>
  {% endif %}
</body>
</html>
